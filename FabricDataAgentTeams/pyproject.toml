[project]
name = "fabric-data-agent-teams"
version = "1.0.0"
description = "Microsoft Teams bot for Fabric Data Agent with SSO"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Bot Framework
    "botbuilder-core>=4.16.0",
    "botbuilder-integration-aiohttp>=4.16.0",
    "botbuilder-dialogs>=4.16.0",
    # Web Framework
    "aiohttp>=3.9.0",
    # Azure Identity (for local development)
    "azure-identity>=1.15.0",
    # HTTP client
    "aiohttp>=3.9.0",
    # Environment
    "python-dotenv>=1.0.0",
    # Application Insights
    "opencensus-ext-azure>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
